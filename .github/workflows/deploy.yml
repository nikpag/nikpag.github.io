name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v3
    # .ruby-version pins the exact Ruby used locally (e.g. 3.3.5), but newer
    # runner images only have the latest patch of each series, so use the
    # newest release of the same series (e.g. 3.3) here.
    - name: Read Ruby series
      id: ruby
      run: echo "series=$(cut -d. -f1,2 .ruby-version)" >> "$GITHUB_OUTPUT"
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ steps.ruby.outputs.series }}
        bundler-cache: true
    - name: Install and Build 🔧
      run: |
        npm install -g mermaid.cli
        export JEKYLL_ENV=production
        bundle exec jekyll build
    - name: Deploy 🚀
      if: github.event_name != 'pull_request'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: _site

